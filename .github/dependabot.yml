version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
          - 'angular-eslint'
          - 'typescript'
          - 'zone.js'
        update-types:
          - minor
          - patch
      docusaurus:
        patterns:
          - '@docusaurus/*'
        update-types:
          - minor
          - patch
      # react and react-dom must move together or the docs build fails.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        dependency-type: development
        # Dependabot ranks a dependency-type-only group above any wildcard
        # pattern, so every wildcard used by another group must be excluded
        # here or its devDependencies get split off into this group.
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@docusaurus/*'
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps of these are done by hand with ng update.
      - dependency-name: '@angular/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@angular-devkit/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@schematics/angular'
        update-types:
          - version-update:semver-major
      - dependency-name: 'ng-packagr'
        update-types:
          - version-update:semver-major
      - dependency-name: 'angular-eslint'
        update-types:
          - version-update:semver-major
      # eslint and typescript-eslint majors need checking against
      # angular-eslint first.
      - dependency-name: 'eslint'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript-eslint'
        update-types:
          - version-update:semver-major
      # TypeScript minors are tied to the Angular version.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # labeler v5 changed the labeler.yml format; upgrade it separately.
      - dependency-name: 'actions/labeler'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - '*'
