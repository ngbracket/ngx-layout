version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
          - 'angular-eslint'
        update-types:
          - minor
          - patch
      docusaurus:
        patterns:
          - '@docusaurus/*'
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps are done by hand with ng update.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
